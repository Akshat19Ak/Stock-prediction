<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    .box { fill: #ffffff; stroke: #2b2b2b; stroke-width:2px; rx:8; }
    .title { font: bold 18px sans-serif; fill: #0b3d91; }
    .label { font: 14px sans-serif; fill: #222222; }
    .small { font: 12px sans-serif; fill: #333333; }
    .arrow { stroke: #444444; stroke-width:2; fill:none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444444" />
    </marker>
  </defs>

  <!-- UI -->
  <rect x="60" y="40" width="480" height="110" class="box" />
  <text x="300" y="72" text-anchor="middle" class="title">Streamlit Frontend</text>
  <text x="300" y="96" text-anchor="middle" class="label">app.py • User inputs, controls, visualizations</text>

  <!-- Ingest -->
  <rect x="660" y="40" width="480" height="160" class="box" />
  <text x="900" y="72" text-anchor="middle" class="title">Data Ingestion</text>
  <text x="900" y="100" text-anchor="middle" class="label">yfinance Download</text>
  <text x="900" y="122" text-anchor="middle" class="small">cached DataFrame • preprocessing • scaling</text>

  <!-- Arrow UI -> Ingest -->
  <path d="M540 95 L660 95" class="arrow" />

  <!-- Engine (center) -->
  <rect x="200" y="220" width="800" height="260" class="box" />
  <text x="600" y="254" text-anchor="middle" class="title">Prediction Engine</text>
  <text x="600" y="280" text-anchor="middle" class="label">Execution split: SARIMAX live fit OR LSTM inference from artifacts</text>

  <!-- SARIMAX box -->
  <rect x="240" y="320" width="260" height="110" class="box" />
  <text x="370" y="352" text-anchor="middle" class="label">SARIMAX</text>
  <text x="370" y="372" text-anchor="middle" class="small">statsmodels • live fit • interpretable</text>

  <!-- LSTM box -->
  <rect x="700" y="320" width="260" height="110" class="box" />
  <text x="830" y="352" text-anchor="middle" class="label">LSTM Inference</text>
  <text x="830" y="372" text-anchor="middle" class="small">keras model loaded from artifacts • fast predict()</text>

  <!-- Artifacts box -->
  <rect x="700" y="520" width="260" height="90" class="box" />
  <text x="830" y="554" text-anchor="middle" class="label">Artifacts</text>
  <text x="830" y="574" text-anchor="middle" class="small">lstm_model.keras • scaler.pkl • sequences</text>

  <!-- Arrows to engine components -->
  <path d="M600 180 L600 220" class="arrow" />
  <path d="M420 320 L500 320" class="arrow" />
  <path d="M700 360 L700 360" class="arrow" />
  <path d="M600 360 L760 360" class="arrow" />
  <path d="M830 430 L830 520" class="arrow" />
  <path d="M830 610 L830 430" class="arrow" />

  <!-- Ensemble / Dashboard -->
  <rect x="420" y="610" width="360" height="100" class="box" />
  <text x="600" y="644" text-anchor="middle" class="title">Ensemble & Dashboard</text>
  <text x="600" y="668" text-anchor="middle" class="label">Combine SARIMAX + LSTM outputs • Plotly visuals</text>

  <path d="M500 380 L500 610" class="arrow" />
  <path d="M830 430 L600 610" class="arrow" />

  <!-- Offline training -->
  <rect x="60" y="740" width="360" height="100" class="box" />
  <text x="240" y="774" text-anchor="middle" class="title">Offline Training</text>
  <text x="240" y="796" text-anchor="middle" class="label">Notebook retrain • export .keras & .pkl to artifacts</text>

  <path d="M320 740 L600 740" class="arrow" />
  <path d="M600 740 L830 640" class="arrow" />

  <!-- Infra -->
  <rect x="780" y="740" width="360" height="100" class="box" />
  <text x="960" y="774" text-anchor="middle" class="title">Deployment & Observability</text>
  <text x="960" y="796" text-anchor="middle" class="label">Streamlit Cloud / Docker • Logging • Health checks</text>

</svg>